    <rect x="354" y="101" width="292" height="111" rx="14" fill="#172b3a" stroke="#77a9ff" stroke-opacity=".55"/>
    <circle cx="385" cy="137" r="13" fill="#77a9ff"/><text x="385" y="142" text-anchor="middle" fill="#101827" font-size="13" font-weight="700">2</text>
